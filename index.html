<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Necromunda Delaque Gang Companion</title>
    <meta name="description" content="Compagnon de gestion et de campagne pour le gang Delaque dans Necromunda : recrutement, pouvoirs psychoteric wyrd, suivi de gang, combat et post-cycle." />
    <meta property="og:title" content="Necromunda Delaque Gang Companion" />
    <meta property="og:description" content="Compagnon de gestion et de campagne pour le gang Delaque dans Necromunda : recrutement, pouvoirs psychoteric wyrd, suivi de gang, combat et post-cycle." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!-- Top Bar des Informations de Gang -->
    <div id="top-bar" class="hidden" style="display:none;"></div>

    <!-- Conteneur Principal -->
    <div id="app-container">
      <div id="main-content"></div>
    </div>

    <!-- Modale Réutilisable avec Boutons de fermeture Haut et Bas -->
    <div id="modal-overlay" class="modal hidden" style="display:none;">
      <div class="modal-content">
        <div id="modal-header" style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--accent-secondary, #c25e1a); padding-bottom:8px; margin-bottom:12px; flex-shrink:0;">
          <h3 id="modal-title" style="margin:0; font-size:17px; color:var(--accent-primary, #00d2b4);">Détails</h3>
          <button id="modal-close-top" class="btn-danger" style="margin:0; padding:4px 10px; font-size:12px; cursor:pointer;" onclick="closeModal()">✕ Fermer</button>
        </div>
        <div id="modal-body"></div>
        <div id="modal-footer" style="display:flex; justify-content:flex-end; align-items:center; border-top:1px solid #333; padding-top:10px; margin-top:12px; flex-shrink:0;">
          <button id="modal-close-bottom" class="btn" style="padding:6px 18px; margin:0;" onclick="closeModal()">Fermer</button>
        </div>
      </div>
    </div>

    <div id="root" style="display:none;"></div>
    
    <!-- Scripts de Données et Logique Applicative -->
    <script src="./data.js"></script>
    <script src="./app.js"></script>
    <script src="./game.js"></script>
    <script src="./postbattle.js"></script>
  </body>
</html>
